#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]

    # The app must be installed at the root of a dedicated domain; the GUI
    # has absolute-path expectations and the gate excludes it by host+prefix.
    exclude = ["install.subdir", "install.multi"]

    args.protected_domains = ""
