# Managed by the Anubis YunoHost app (__APP__) - disabled from the Anubis web GUI.
# Bot-shield for __DOMAIN__: rewrite phase gate, runs BEFORE ssowat's access
# phase so bots are challenged before they ever reach the SSO login page.

rewrite_by_lua_file __INSTALL_DIR__/gate.lua;

# Serve Anubis' challenge page + its static assets on this domain
# (the gate's /api/check call is a direct cosocket from gate.lua -
# ngx.location.capture cannot run inside HTTP/2 requests).
location /.within.website/ {
    rewrite_by_lua_block { }
    access_by_lua_block { }

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $anubis_client_ip;
}
