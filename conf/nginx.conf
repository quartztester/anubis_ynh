location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT_WEBUI__;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # resend underscored YNH_USER dashed; waitress drops underscored headers (RFC 7230)
    proxy_set_header Ynh-User $http_ynh_user;

    # ssowat is the real gate: strip any Basic auth so it never reaches Flask
    proxy_set_header Authorization "";
}
