location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT_WEBUI__;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ssowat injects YNH_USER (underscore); waitress drops underscored
    # headers per RFC 7230. Re-send it dashed - both map to the same WSGI
    # key HTTP_YNH_USER.
    proxy_set_header Ynh-User $http_ynh_user;

    # ssowat is the real gate: strip any Basic auth so it never reaches Flask
    proxy_set_header Authorization "";
}
